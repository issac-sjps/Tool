<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄市國中小學區查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1ECDD;
  --panel:#FBF9F2;
  --ink:#1E2A3A;
  --ink-soft:#586278;
  --stamp:#A3352A;
  --gold:#8A6D3B;
  --line:#D3CCB6;
  --line-strong:#B3AA8C;
  --ok-ink:#3E5C2E;
  --warn-bg:#F7E7C9;
  --header-h:56px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans TC', sans-serif;
  line-height:1.55;
  overflow:hidden;
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* ===== compact top bar ===== */
.topbar{
  height:var(--header-h);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  border-bottom:2px solid var(--ink);
  background:var(--panel);
  flex-shrink:0;
}
.brand{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  font-size:17px;
  white-space:nowrap;
  display:flex;
  align-items:baseline;
  gap:6px;
}
.brand .stamp-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--stamp);
  display:inline-block;
}
.level-toggle{
  display:flex;
  border:1.5px solid var(--ink);
  border-radius:20px;
  overflow:hidden;
  flex-shrink:0;
}
.level-toggle button{
  font-family:'Noto Sans TC', sans-serif;
  font-size:13.5px;
  font-weight:700;
  padding:6px 16px;
  border:none;
  background:transparent;
  color:var(--ink);
  cursor:pointer;
}
.level-toggle button.active{
  background:var(--ink);
  color:#fff;
}
.topbar-spacer{flex:1;}
.info-btn{
  width:26px;height:26px;
  border-radius:50%;
  border:1.5px solid var(--stamp);
  color:var(--stamp);
  background:transparent;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  flex-shrink:0;
  position:relative;
}
.info-pop{
  display:none;
  position:absolute;
  top:34px;
  right:0;
  width:300px;
  background:#fff;
  border:1px solid var(--line-strong);
  box-shadow:0 6px 18px rgba(30,42,58,.18);
  border-radius:6px;
  padding:14px 16px;
  font-size:12.5px;
  color:var(--ink-soft);
  text-align:left;
  z-index:50;
  line-height:1.7;
}
.info-btn.open .info-pop{display:block;}
.info-pop b{color:var(--stamp);}

/* ===== app body: sidebar + results, no page scroll ===== */
.app{
  display:grid;
  grid-template-columns:320px 1fr;
  height:calc(100% - var(--header-h));
}
@media (max-width:820px){
  .app{
    display:block;
    height:auto;
    overflow:visible;
  }
  body{overflow:auto;}
}

/* sidebar */
.sidebar{
  border-right:1px solid var(--line);
  background:var(--panel);
  padding:18px 18px 20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}
@media (max-width:820px){
  .sidebar{border-right:none; border-bottom:2px solid var(--line-strong);}
}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{
  font-size:12px;
  color:var(--ink-soft);
  font-weight:700;
  display:flex; align-items:center; gap:5px;
}
.field label .req{color:var(--stamp);}
.field select, .field input{
  font-family:'Noto Sans TC', sans-serif;
  font-size:15px;
  padding:9px 10px;
  border:1px solid var(--line-strong);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  width:100%;
}
.field select:focus, .field input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
.field input:disabled, .field select:disabled{ background:#EFEBDE; color:#9a927a; cursor:not-allowed; }
.hint-line{ font-size:11.5px; color:var(--ink-soft); }
.clear-btn{
  align-self:flex-start;
  font-size:12px;
  color:var(--ink-soft);
  background:none;
  border:1px solid var(--line-strong);
  border-radius:14px;
  padding:4px 12px;
  cursor:pointer;
}
.clear-btn:hover{ border-color:var(--stamp); color:var(--stamp); }

.sidebar hr{ border:none; border-top:1px dashed var(--line-strong); margin:2px 0; }

.legend{
  font-size:11.5px;
  color:var(--ink-soft);
  display:flex;
  flex-direction:column;
  gap:6px;
}
.legend .row{display:flex; align-items:center; gap:7px;}
.legend .swatch{width:11px;height:11px;border-radius:3px; flex-shrink:0;}
.sw-free{background:var(--stamp);}
.sw-fixed{background:var(--ink);}

.quota-toggle{
  font-size:12px;
  color:var(--gold);
  background:none;
  border:none;
  padding:0;
  cursor:pointer;
  text-align:left;
  font-weight:700;
}
.quota-box{
  display:none;
  font-size:11.5px;
  color:var(--ink-soft);
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
  padding:10px 12px;
  line-height:1.8;
}
.quota-box.open{display:block;}
.quota-box b{color:var(--ink);}

/* results panel */
.main{
  overflow-y:auto;
  padding:18px 22px 40px;
}
.results-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.results-head h2{
  font-family:'Noto Serif TC', serif;
  font-size:16px;
  margin:0;
}
.results-head .count{
  font-family:'Noto Sans Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
}
.empty-state{
  border:1px dashed var(--line-strong);
  border-radius:6px;
  padding:40px 20px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13.5px;
  background:rgba(255,255,255,0.4);
}
.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
  gap:12px;
}
.result-card{
  position:relative;
  background:#FDFCF6;
  border:1px solid var(--line);
  border-left:4px solid var(--ink);
  border-radius:4px;
  padding:14px 16px 14px;
  animation:riseIn .3s ease both;
}
.result-card.is-free{ border-left-color:var(--stamp); }
@keyframes riseIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
.result-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
}
.result-name{
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:16.5px;
}
.result-no{
  font-family:'Noto Sans Mono', monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  margin-right:5px;
}
.badge-row{display:flex; gap:5px; flex-wrap:wrap;}
.badge{
  font-size:10.5px;
  padding:2px 8px;
  border-radius:20px;
  border:1px solid currentColor;
  white-space:nowrap;
}
.badge.b-quota{color:var(--stamp);}
.badge.b-space{color:var(--ok-ink);}
.badge.b-free{color:var(--stamp);}
.badge.b-fixed{color:var(--ink-soft);}
.result-district{
  font-size:11px;
  color:var(--gold);
  margin:6px 0 4px;
}
.result-lines{ margin:0; padding-left:0; list-style:none; font-size:13px; color:var(--ink); }
.result-lines li{ padding:6px 0; border-top:1px dotted var(--line); }
.result-lines li:first-child{ border-top:none; }
.result-lines li mark{ background:#F7E7C9; color:var(--stamp); padding:0 2px; border-radius:2px; }
.line-tag{
  display:inline-block;
  font-size:10px;
  padding:1px 6px;
  border-radius:10px;
  margin-right:5px;
  vertical-align:1px;
}
.line-tag.free{background:var(--stamp); color:#fff;}
.line-tag.fixed{background:var(--ink); color:#fff;}

.scope-tag{
  display:inline-block;
  font-size:10px;
  padding:1px 7px;
  border-radius:10px;
  margin-left:2px;
  vertical-align:1px;
  border:1px solid var(--gold);
  color:var(--gold);
  background:#fff;
}
.scope-tag.scope-all{
  border-color:var(--line-strong);
  color:var(--ink-soft);
}

.read-note{
  font-size:12px;
  color:var(--ink-soft);
  background:var(--warn-bg);
  border:1px solid #D9B872;
  border-left:4px solid var(--gold);
  border-radius:4px;
  padding:10px 14px;
  margin-bottom:14px;
  line-height:1.8;
}
.read-note b{ color:var(--stamp); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="stamp-dot"></span>高雄市學區查詢</div>
  <div class="level-toggle">
    <button id="btn-mid" class="active" type="button">國中</button>
    <button id="btn-elem" type="button">國小</button>
  </div>
  <div class="topbar-spacer"></div>
  <button class="info-btn" id="info-btn" type="button">i
    <div class="info-pop" id="info-pop">
      <b>僅供參考查詢使用</b>，實際學區請以高雄市政府教育局最新公告為準。<br><br>
      <b>什麼是「自由學區」？</b>條文寫「甲校與乙校自由學區」，意思是戶籍在該里（或該鄰）的學生，可以在甲、乙兩校（有時是三校）之中<b>自己選一所</b>登記入學，不用兩間都要考慮、也不是系統自動分配，實際登記流程與截止日期仍以教育局公告為準。<br><br>
      資料整理自高雄市115學年度國民中學／國民小學學區劃分一覽表。116學年度起因里鄰行政區域調整，學區將由教育局另行修正公告，屆時本站資料可能不再適用。<br><br>
      設籍<b>大林蒲地區</b>（小港區鳳森、鳳林、鳳源、鳳興、龍鳳、鳳鳴等6里）者，持居住事實文件可不受戶籍限制，專案就讀學區內國中小（不含總量管制學校）。
    </div>
  </button>
</div>

<div class="app">
  <div class="sidebar">
    <div class="field">
      <label for="sel-district">行政區 <span class="req">必填</span></label>
      <select id="sel-district"><option value="">請選擇行政區</option></select>
    </div>
    <div class="field">
      <label for="inp-village">里別 <span class="req">建議填寫</span></label>
      <input list="village-list" id="inp-village" type="text" placeholder="例如：新上里" disabled>
      <datalist id="village-list"></datalist>
    </div>
    <div class="field">
      <label for="inp-neighbor">鄰別（選填）</label>
      <input id="inp-neighbor" type="text" inputmode="numeric" placeholder="例如：12" disabled>
    </div>
    <button class="clear-btn" id="clear-btn" type="button">清除條件</button>
    <div class="hint-line">先選行政區，再輸入或選擇里別；若同一里依鄰別劃分不同學校，請再填鄰別以利核對條文內容。</div>

    <hr>

    <div class="legend">
      <div class="row"><span class="swatch sw-fixed"></span><span><b>學區內</b>：戶籍在此里（鄰），只對應這一所學校，直接分發就讀。</span></div>
      <div class="row"><span class="swatch sw-free"></span><span><b>自由學區</b>：戶籍在此里（鄰），條文中「與○○國中／國小自由學區」代表這幾所學校<b>可以任選其中一所</b>登記，不是全部都要念，也不是自動分到某一所——由家長在登記時擇一填寫。</span></div>
    </div>

    <hr>

    <button class="quota-toggle" id="quota-toggle" type="button">▸ 總量管制／空間充裕學校說明</button>
    <div class="quota-box" id="quota-box">
      <b>總量管制學校：</b>依全戶設籍先後順序分發入學，額滿為止，超額新生改分發鄰近學校就讀。<br><br>
      <b>空間充裕學校：</b>凡設籍本市之學生均可申請就讀，不受里別限制。<br><br>
      各校是否屬於這兩類，會顯示在查詢結果的徽章上。
    </div>
  </div>

  <div class="main">
    <div class="results-head">
      <h2 id="results-title">查詢結果</h2>
      <span class="count" id="result-count"></span>
    </div>
    <div id="results">
      <div class="empty-state">請先於左側選擇行政區，即可開始查詢。</div>
    </div>
  </div>

<script>
const MID = JSON.parse(document.getElementById('mid-data').textContent);
const ELEM = JSON.parse(document.getElementById('elem-data').textContent);

let currentLevel = 'mid'; // 'mid' | 'elem'
let SCHOOLS = MID;

const districtSel = document.getElementById('sel-district');
const villageInput = document.getElementById('inp-village');
const villageList = document.getElementById('village-list');
const neighborInput = document.getElementById('inp-neighbor');
const resultsEl = document.getElementById('results');
const resultCountEl = document.getElementById('result-count');
const resultsTitle = document.getElementById('results-title');
const btnMid = document.getElementById('btn-mid');
const btnElem = document.getElementById('btn-elem');
const clearBtn = document.getElementById('clear-btn');
const infoBtn = document.getElementById('info-btn');
const quotaToggle = document.getElementById('quota-toggle');
const quotaBox = document.getElementById('quota-box');

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildDistrictOptions(){
  const districtVillages = {};
  const allDistricts = [];
  SCHOOLS.forEach(s => {
    s.areas.forEach(a => {
      if(!districtVillages[a.district]){
        districtVillages[a.district] = new Set();
        allDistricts.push(a.district);
      }
      a.lines.forEach(line => {
        const matches = line.match(/[\u4e00-\u9fa5]{1,4}里/g);
        if(matches) matches.forEach(m => districtVillages[a.district].add(m));
      });
    });
  });
  window.__districtVillages = districtVillages;

  const uniqueDistricts = [...new Set(allDistricts)].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  districtSel.innerHTML = '<option value="">請選擇行政區</option>';
  uniqueDistricts.forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    districtSel.appendChild(opt);
  });
}

function highlightVillage(line, village){
  const esc = escapeHtml(line);
  if(!village) return esc;
  const escVillage = escapeHtml(village);
  return esc.split(escVillage).join(`<mark>${escVillage}</mark>`);
}

function quotaBadge(quota){
  if(quota === '總量管制') return `<span class="badge b-quota">總量管制</span>`;
  if(quota === '空間充裕') return `<span class="badge b-space">空間充裕</span>`;
  return '';
}

function renderEmpty(msg){
  resultsEl.innerHTML = `<div class="empty-state">${msg}</div>`;
  resultCountEl.textContent = '';
}

function extractNeighborTag(line){
  // find 鄰 ranges/numbers mentioned in this line, e.g. "32鄰、33鄰、53鄰" or "1-9鄰"
  const nums = line.match(/[0-9０-９]+(?:[-－][0-9０-９]+)?鄰/g);
  if(!nums || nums.length === 0) return null; // no neighbor scoping -> whole village
  // dedupe while keeping order
  const seen = new Set();
  const uniq = nums.filter(n => { if(seen.has(n)) return false; seen.add(n); return true; });
  return uniq.join('、');
}

function doSearch(){
  const district = districtSel.value;
  const villageRaw = villageInput.value.trim();
  const neighbor = neighborInput.value.trim();
  const schoolWord = currentLevel === 'mid' ? '國中' : '國小';

  if(!district){
    renderEmpty(`請先於左側選擇行政區，即可開始查詢。`);
    return;
  }

  let matches = [];
  SCHOOLS.forEach(s => {
    s.areas.forEach(a => {
      if(a.district !== district) return;
      a.lines.forEach(line => {
        const villageOk = villageRaw ? line.includes(villageRaw) : true;
        if(!villageOk) return;
        matches.push({school:s, district:a.district, line});
      });
    });
  });

  if(matches.length === 0){
    if(villageRaw){
      renderEmpty(`在「${escapeHtml(district)}」中找不到包含「${escapeHtml(villageRaw)}」的里別資料，請確認里別名稱是否正確（可從清單中選取）。`);
    } else {
      renderEmpty('查無資料。');
    }
    return;
  }

  const bySchool = new Map();
  matches.forEach(m => {
    if(!bySchool.has(m.school.no)) bySchool.set(m.school.no, {school:m.school, lines:[], district:m.district});
    bySchool.get(m.school.no).lines.push(m.line);
  });

  resultCountEl.textContent = `共比對到 ${bySchool.size} 所${schoolWord}，${matches.length} 筆條文`;

  let html = '';

  if(villageRaw){
    html += `<div class="read-note">
      <b>怎麼看這些結果：</b>下面每張卡片是一所學校。若某條文旁標示「適用鄰別」，代表<b>只有那幾鄰</b>符合這條規則（可能是固定學區、也可能是自由學區可擇一）；若沒有標示鄰別，代表「${escapeHtml(villageRaw)}」<b>全里</b>都適用這條規則。
      同一個里常常會分屬不同鄰給不同學校，請把「${escapeHtml(villageRaw)}」相關的每一張卡片都看過一遍，找到您實際戶籍所在的鄰別對應哪一張卡片、標示的是「學區內」還是「自由學區・可擇一」。
    </div>`;
  }

  html += '<div class="result-grid">';
  bySchool.forEach(({school, lines, district: matchedDistrict}) => {
    const isFreeAny = lines.some(l => l.includes('自由學區'));
    const cardClass = isFreeAny ? 'result-card is-free' : 'result-card';
    let linesHtml = lines.map(l => {
      const isFree = l.includes('自由學區');
      const tag = isFree ? `<span class="line-tag free">自由學區・可擇一</span>` : `<span class="line-tag fixed">學區內（固定）</span>`;
      const neiTag = extractNeighborTag(l);
      const scopeTag = neiTag
        ? `<span class="scope-tag">僅：${escapeHtml(neiTag)}</span>`
        : `<span class="scope-tag scope-all">全里適用</span>`;
      let content = highlightVillage(l, villageRaw);
      if(neighbor){
        const safe = neighbor.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        const neiPattern = new RegExp('(' + safe + ')鄰');
        content = content.replace(neiPattern, '<mark>$1</mark>鄰');
      }
      return `<li>${tag}${scopeTag}<br>${content}</li>`;
    }).join('');

    html += `
    <div class="${cardClass}">
      <div class="result-top">
        <div>
          <span class="result-no">No.${school.no}</span>
          <span class="result-name">${escapeHtml(school.name)}</span>
        </div>
        <div class="badge-row">
          ${quotaBadge(school.quota)}
          ${isFreeAny ? '<span class="badge b-free">部分鄰為自由學區（可擇一）</span>' : '<span class="badge b-fixed">依里劃分</span>'}
        </div>
      </div>
      <div class="result-district">戶籍行政區：${escapeHtml(matchedDistrict)}</div>
      <ul class="result-lines">${linesHtml}</ul>
    </div>`;
  });
  html += '</div>';

  resultsEl.innerHTML = html;
}

function resetFields(){
  villageInput.value = '';
  neighborInput.value = '';
  villageList.innerHTML = '';
  villageInput.disabled = !districtSel.value;
  neighborInput.disabled = !districtSel.value;
  if(districtSel.value){
    const villages = [...(window.__districtVillages[districtSel.value] || [])].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    villages.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      villageList.appendChild(opt);
    });
  }
}

districtSel.addEventListener('change', () => { resetFields(); doSearch(); });
villageInput.addEventListener('input', doSearch);
neighborInput.addEventListener('input', doSearch);

clearBtn.addEventListener('click', () => {
  districtSel.value = '';
  resetFields();
  doSearch();
});

btnMid.addEventListener('click', () => {
  if(currentLevel === 'mid') return;
  currentLevel = 'mid';
  SCHOOLS = MID;
  btnMid.classList.add('active');
  btnElem.classList.remove('active');
  resultsTitle.textContent = '查詢結果（國中）';
  districtSel.value = '';
  buildDistrictOptions();
  resetFields();
  doSearch();
});
btnElem.addEventListener('click', () => {
  if(currentLevel === 'elem') return;
  currentLevel = 'elem';
  SCHOOLS = ELEM;
  btnElem.classList.add('active');
  btnMid.classList.remove('active');
  resultsTitle.textContent = '查詢結果（國小）';
  districtSel.value = '';
  buildDistrictOptions();
  resetFields();
  doSearch();
});

infoBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  infoBtn.classList.toggle('open');
});
document.addEventListener('click', () => infoBtn.classList.remove('open'));

quotaToggle.addEventListener('click', () => {
  quotaBox.classList.toggle('open');
  quotaToggle.textContent = (quotaBox.classList.contains('open') ? '▾ ' : '▸ ') + '總量管制／空間充裕學校說明';
});

resultsTitle.textContent = '查詢結果（國中）';
buildDistrictOptions();
</script>
